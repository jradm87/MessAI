name: package

# Gera AppImage + .deb e publica no GitHub Release ao dar push numa tag v*.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Toolchain para addons nativos
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsecret-1-dev
      - run: npm ci
      - name: Empacotar e publicar
        run: node scripts/package.mjs --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar artefatos do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messai-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: ignore
