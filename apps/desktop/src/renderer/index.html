<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data:" />
    <title>MessAI</title>
    <style>
      /* Splash estático: pinta imediatamente, enquanto o bundle React compila (~alguns segundos no 1º load). */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0a0a0b; color: #e7e9ee; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .25s ease; }
      #splash .logo { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
      #splash .spin { width: 22px; height: 22px; border: 2px solid #2a2c31; border-top-color: #5aa9ff; border-radius: 50%; animation: messspin .8s linear infinite; }
      @keyframes messspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg width="88" height="88" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#15171c"/><path d="M176 196 C 236 184, 300 300, 348 322" fill="none" stroke="#5aa9ff" stroke-width="11" stroke-linecap="round" opacity="0.9"/><rect x="112" y="150" width="132" height="94" rx="18" fill="#1b2130" stroke="#5aa9ff" stroke-width="5"/><rect x="300" y="282" width="132" height="94" rx="18" fill="#1b2130" stroke="#4cd964" stroke-width="5"/><path d="M138 182 l 18 15 l -18 15" fill="none" stroke="#6fd38a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M326 314 l 18 15 l -18 15" fill="none" stroke="#6fd38a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="logo">MessAI</div><div class="spin"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
